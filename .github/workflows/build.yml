name: Build & Release Sentinel Music Desktop

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test and Build Desktop (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: src-tauri

      - name: Run Asset & Configuration Tests
        run: npm test

      - name: Run Rust Integration Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Desktop Application
        run: npx @tauri-apps/cli build

      - name: Prepare Standalone Portable Executable & Installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts

          # 1. Standalone Portable Executable (не требует установки, готов к запуску)
          $rawExe = Get-ChildItem -Path "src-tauri/target/release/*.exe" -Exclude "*.pdb" | Where-Object { $_.Name -like "*sentinel*" -or $_.Name -like "*music*" } | Select-Object -First 1
          if ($rawExe) {
            Write-Host "Found standalone executable: $($rawExe.FullName)"
            Copy-Item $rawExe.FullName "dist-artifacts/Sentinel-Music-Portable.exe"
          } else {
            Write-Error "Portable executable not found in src-tauri/target/release/"
          }

          # 2. NSIS Installer (установщик для Windows)
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Write-Host "Found NSIS installer: $($nsis.FullName)"
            Copy-Item $nsis.FullName "dist-artifacts/Sentinel-Music-Setup.exe"
          }

          # 3. MSI Installer
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "Found MSI installer: $($msi.FullName)"
            Copy-Item $msi.FullName "dist-artifacts/Sentinel-Music-Setup.msi"
          }

          Write-Host "--- Prepared Artifacts ---"
          Get-ChildItem -Path dist-artifacts

      - name: Upload Artifacts (Portable EXE & Installers)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sentinel-music-desktop-windows
          path: dist-artifacts/*

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist-artifacts/Sentinel-Music-Portable.exe
            dist-artifacts/Sentinel-Music-Setup.exe
            dist-artifacts/Sentinel-Music-Setup.msi
          draft: false
          prerelease: false
          generate_release_notes: true
