[package]
name = "sentinel-music-desktop"
version = "0.0.2"
description = "Легковесный десктопный плеер Sentinel Music"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
