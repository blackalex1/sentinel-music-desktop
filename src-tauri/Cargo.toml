[package]
name = "sentinel-music-desktop"
version = "0.0.6"
description = "Легковесный десктопный плеер Sentinel Music"
edition = "2021"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.6", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
